plugins {
    id 'com.android.application'
}

def releaseKeystoreFile = System.getenv('ANDROID_KEYSTORE_FILE')
def releaseKeystorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')

dependencies {
    implementation 'androidx.core:core:1.13.1'
}

android {
    namespace 'br.com.phservicefortal.phos'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.phservicefortal.phos'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (releaseKeystoreFile) {
                storeFile file(releaseKeystoreFile)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            versionNameSuffix '-teste'
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled false
        }
    }
}
